  <rect x="36" y="66" width="28" height="14" rx="3" fill="rgba(15, 23, 42, 0.9)" stroke="#f43f5e" stroke-width="1" />
  <text x="50" y="77" font-family="monospace" font-size="11" font-weight="900" fill="#f43f5e" text-anchor="middle">15x</text>
