<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grenade-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d7c0f" />
      <stop offset="50%" stop-color="#365314" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="grenade-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <!-- Pull Ring & Cotter Pin -->
  <circle cx="28" cy="22" r="10" fill="none" stroke="#e2e8f0" stroke-width="3" />
  <circle cx="28" cy="22" r="6" fill="none" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="38" y1="22" x2="48" y2="24" stroke="#e2e8f0" stroke-width="3" />
  <!-- Safety Lever / Spoon -->
  <path d="M 48 22 L 68 20 C 72 20, 76 26, 75 34 L 70 70 C 69 76, 65 78, 62 76" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round" />
  <!-- Fuse Mechanism / Top Cap -->
  <rect x="42" y="16" width="16" height="14" rx="2" fill="url(#grenade-cap)" stroke="#0f172a" stroke-width="2" />
  <!-- Main Pineapple Frag Body -->
  <ellipse cx="50" cy="58" rx="28" ry="32" fill="url(#grenade-body)" stroke="#0f172a" stroke-width="3" />
  <!-- Serrated Fragment Grid Lines -->
  <path d="M 30 46 C 42 42, 58 42, 70 46" fill="none" stroke="#0f172a" stroke-width="2" />
  <path d="M 24 58 C 40 54, 60 54, 76 58" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <path d="M 30 70 C 42 66, 58 66, 70 70" fill="none" stroke="#0f172a" stroke-width="2" />
  <line x1="40" y1="34" x2="38" y2="82" stroke="#0f172a" stroke-width="2" />
  <line x1="50" y1="32" x2="50" y2="84" stroke="#0f172a" stroke-width="2.5" />
  <line x1="60" y1="34" x2="62" y2="82" stroke="#0f172a" stroke-width="2" />
  <!-- Bright Yellow Tactical Ring -->
  <rect x="42" y="30" width="16" height="3" fill="#facc15" />
  <!-- Sparking Fuse Hint -->
  <circle cx="50" cy="14" r="3" fill="#ef4444" />
</svg>
